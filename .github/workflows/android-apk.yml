name: Gerar Favoritos Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK de teste
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Confirmar SDK Android
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}" 
          if [ ! -d "${ANDROID_HOME}/platforms/android-35" ]; then
            sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - name: Compilar APK de teste
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Favoritos-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
